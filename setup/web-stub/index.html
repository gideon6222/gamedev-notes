<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Both hrefs are RELATIVE, with no leading slash: Pages serves this from
     https://<owner>.github.io/{{SLUG}}/ and not from a domain root, so "/manifest.webmanifest"
     would 404 and the game would install with no name and no icon. vite.config.js sets
     base: './' for the same reason. Both files are in public/ and are precached by the
     service worker, so an installed app keeps its icon offline. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>{{NAME}}</title>
<!-- The error overlay must be the FIRST script in the document. On a phone with no
     devtools it is the only way to see a stack trace, and Vite hoists the bundled entry
     script into <head> during build, so a handler left down in <body> would be registered
     too late to catch the very failures worth catching. -->
<script>
  function showErr(m) {
    var e = document.getElementById('err');
    e.classList.remove('hidden');
    e.textContent += m + '\n\n';
    var b = document.getElementById('boot');
    if (b) b.classList.add('hidden');
  }
  window.addEventListener('error', function (ev) {
    showErr((ev.error && ev.error.stack) || ev.message || String(ev));
  });
  window.addEventListener('unhandledrejection', function (ev) {
    showErr('unhandled rejection: ' + ((ev.reason && ev.reason.stack) || ev.reason));
  });
</script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05070d; color: #cfe3ff;
               font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
               overscroll-behavior: none; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; left: 12px; top: calc(12px + env(safe-area-inset-top));
         pointer-events: none; letter-spacing: .08em; }
  #stamp { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
           opacity: .45; font-size: 10px; }
  #boot { position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
          letter-spacing: .3em; }
  #err { position: fixed; inset: 0; padding: 16px; overflow: auto; background: #1a0407;
         color: #ffb4b4; white-space: pre-wrap; font-size: 11px; z-index: 99; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="game"></div>
<div id="hud"><span id="ticks">0</span> TICKS</div>
<div id="stamp"></div>
<div id="boot">{{NAME}}<br><span style="font-size:10px">LOADING</span></div>
<div id="err" class="hidden"></div>

<script type="module" src="/src/main.ts"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>

</body>
</html>
